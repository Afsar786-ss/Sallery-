name: Build Afsar Mobile Hisab APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Download Repository Files
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
- name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 35
          build-tools: 35.0.0
          accept-android-sdk-licenses: true
      

      - name: Accept Android Licenses
        shell: bash
        run: |
          SDKMANAGER="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: Android SDK Manager not found"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses

      - name: Install Required SDK Packages
        shell: bash
        run: |
          SDKMANAGER="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Verify Project ZIP
        shell: bash
        run: |
          test -f Afsar_Mobile_Paise_Ka_Hisab_Project.zip || {
            echo "ERROR: Project ZIP not found in repository root"
            ls -la
            exit 1
          }

      - name: Extract Android Project
        run: |
          unzip -o Afsar_Mobile_Paise_Ka_Hisab_Project.zip -d project

      - name: Verify Gradle Project
        run: |
          test -f project/AfsarMobileAndroidProject/app/build.gradle || {
            echo "ERROR: Android app build.gradle not found"
            find project -maxdepth 4 -type f
            exit 1
          }

      - name: Build Debug APK
        run: |
          gradle -p project/AfsarMobileAndroidProject assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Afsar-Mobile-Hisab-APK
          path: project/AfsarMobileAndroidProject/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
