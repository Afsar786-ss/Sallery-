name: Build Afsar Mobile Hisab APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android Licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses || true

      - name: Install Required Android Packages
        shell: bash
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Check Project ZIP
        run: |
          test -f Afsar_Mobile_Paise_Ka_Hisab_Project.zip

      - name: Extract Project
        run: |
          unzip -o Afsar_Mobile_Paise_Ka_Hisab_Project.zip -d project

      - name: Build APK
        run: |
          gradle -p project/AfsarMobileAndroidProject assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Afsar-Mobile-Hisab-APK
          path: project/AfsarMobileAndroidProject/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
