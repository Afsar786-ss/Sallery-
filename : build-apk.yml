name: Build Afsar Mobile Hisab APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '11076708'
          accept-android-sdk-licenses: true

      - name: Accept Android SDK Licenses
        shell: bash
        run: |
          set -e
          yes | sdkmanager --licenses

      - name: Install Android SDK Packages
        shell: bash
        run: |
          set -e
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Verify Project ZIP
        shell: bash
        run: |
          if [ ! -f "Afsar_Mobile_Paise_Ka_Hisab_Project.zip" ]; then
            echo "ERROR: Project ZIP not found in repository root."
            ls -la
            exit 1
          fi

      - name: Extract Android Project
        run: |
          unzip -o Afsar_Mobile_Paise_Ka_Hisab_Project.zip -d project

      - name: Verify Android Project
        shell: bash
        run: |
          if [ ! -f "project/AfsarMobileAndroidProject/app/build.gradle" ]; then
            echo "ERROR: Android project files not found."
            find project -maxdepth 4 -type f
            exit 1
          fi

      - name: Build Debug APK
        run: |
          gradle \
            -p project/AfsarMobileAndroidProject \
            assembleDebug \
            --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Afsar-Mobile-Hisab-APK
          path: project/AfsarMobileAndroidProject/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
